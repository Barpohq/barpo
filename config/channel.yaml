      Yangi model Fable 5 darajasidagi imkoniyatlarni yarim narxda taklif
      qiladi. Kodlash va bilim ishlari bo'yicha Frontier-Bench sinovida
      birinchi o'rinni egalladi.

      • Narx avvalgi Opus 4.8 bilan bir xil qoldi
      • Claude Max'da asosiy model sifatida yoqilgan
      • Kiberxavfsizlik masalalarida Mythos 5 dan orqada

      Nega muhim: kundalik ishlatish uchun mo'ljallangan — narx va tezlik
      nisbati endi yirik loyihalarda ham Opus'ni tanlash imkonini beradi.

      🔗 <a href="https://www.anthropic.com/news/claude-opus-5">Manba</a>  #AI #ModelRelease

