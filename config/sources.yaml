# Yangilik manbalari.
# Manba qo'shish/olib tashlash uchun kod o'zgartirish shart emas.
# `enabled: false` — vaqtincha o'chirish.

defaults:
  # Bitta siklda bitta manbadan olinadigan maksimal element
  max_items: 40
  # HTTP so'rov timeout (soniya)
  timeout: 20

sources:
  # ─── Rasmiy bloglar (RSS) — eng ishonchli manba ───
  # Diqqat: Anthropic va Meta AI rasmiy AI feed chiqarmaydi. 2026-07-26 da
  # qayta tekshirildi: anthropic.com uchun /rss.xml, /news/rss.xml, /feed.xml,
  # /atom.xml, /index.xml, /engineering/rss.xml — barchasi 404, HTML'da ham
  # feed havolasi yo'q. ai.meta.com/blog/rss/ ham 404.
  #
  # Meta uchun engineering.fb.com/feed/ va about.fb.com/news/feed/ ishlaydi,
  # lekin ular yaroqsiz: birinchisi infratuzilma/reklama muhandisligi haqida,
  # ikkinchisi korporativ PR (Rank ularni spam deb belgilagan).
  #
  # Shuning uchun ikkalasi uchun Google News RSS qoldirilmoqda. Havola
  # muammosi hal qilingan: collector `<source url>` tegidan haqiqiy
  # nashriyotni olib `extra.publisher_url` ga yozadi, dedup va Writer
  # agregator redirect'i o'rniga o'shani ishlatadi.
  - name: anthropic-news
    type: rss
    url: "https://news.google.com/rss/search?q=Anthropic+Claude+when:7d&hl=en-US&gl=US&ceid=US:en"
    weight: 1.0

  - name: openai-blog
    type: rss
    url: https://openai.com/news/rss.xml
    weight: 1.0

  - name: google-ai-blog
    type: rss
    url: https://blog.google/technology/ai/rss/
    weight: 0.9

  - name: deepmind-blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    weight: 0.9

  - name: huggingface-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    weight: 0.8

  - name: meta-ai-blog
    type: rss
    url: "https://news.google.com/rss/search?q=%22Meta+AI%22+OR+Llama+model+when:7d&hl=en-US&gl=US&ceid=US:en"
    weight: 0.7

  - name: mistral-news
    type: rss
    url: https://mistral.ai/rss.xml
    weight: 0.7

  # ─── Hacker News (Algolia API) ───
  - name: hn-ai
    type: hackernews
    # Diqqat: Algolia OR operatorini tushunmaydi — har bir so'rov alohida
    # yuboriladi, natijalar objectID bo'yicha birlashtiriladi.
    queries:
      - AI
      - LLM
      - Claude
      - OpenAI
      - "open source model"
    # Shu balldan yuqori postlar olinadi
    min_points: 50
    lookback_days: 3
    max_items: 30
    weight: 0.6

  # ─── Keyingi bosqichda yoqiladi (Faza 1 oxirida sifat baholangach) ───
  - name: reddit-localllama
    type: reddit
    subreddit: LocalLLaMA
    min_score: 150
    enabled: false
    weight: 0.5

  - name: arxiv-cs-ai
    type: arxiv
    categories: [cs.AI, cs.CL, cs.LG]
    enabled: false
    weight: 0.4
