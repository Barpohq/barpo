[project]
name = "ai-news-bot"
version = "0.1.0"
description = "Telegram kanali uchun avtonom AI yangiliklar boti"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "feedparser>=6.0.11",
    "apscheduler>=3.11",
    "rapidfuzz>=3.10",
    "sentence-transformers>=3.3",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "aiogram>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
bot = "bot.__main__:main"
monitor = "monitor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "core", "monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
